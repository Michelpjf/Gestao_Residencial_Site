<div id="tab-inquilinos" class="tab-content">
    <div class="contract-container">
        <div class="subtab-header" style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px;">
            <div>
                <h3 style="font-family:var(--font-heading);color:var(--primary);font-size:18px;font-weight:700;">Moradores</h3>
                <p style="font-size:13px;color:var(--neutral-500);">Cadastro mínimo persistido e vinculado a uma Unidade.</p>
            </div>
            <button id="btn-retry-tenants" type="button" class="btn-secondary" hidden>Tentar novamente</button>
        </div>
        <div id="tenants-status" class="buildings-status" role="status" aria-live="polite" hidden><span id="tenants-status-message"></span></div>
        <form id="form-new-tenant" class="tenant-form">
            <h4 style="margin-bottom:14px;">Cadastrar Morador</h4>
            <div class="tenant-form-grid">
                <div class="form-group"><label for="new-tenant-building">Residencial</label><select id="new-tenant-building" required></select></div>
                <div class="form-group"><label for="new-tenant-unit">Unidade</label><select id="new-tenant-unit" required disabled><option value="">Selecione o Residencial</option></select></div>
                <div class="form-group"><label for="new-tenant-name">Nome completo</label><input id="new-tenant-name" maxlength="160" required></div>
                <div class="form-group"><label for="new-tenant-cpf">CPF</label><input id="new-tenant-cpf" maxlength="14" inputmode="numeric" required></div>
                <div class="form-group"><label for="new-tenant-rg">RG</label><input id="new-tenant-rg" maxlength="30" required></div>
                <div class="form-group"><label for="new-tenant-birth-date">Data de nascimento</label><input id="new-tenant-birth-date" type="date" required></div>
                <div class="form-group"><label for="new-tenant-marital-status">Estado civil</label><input id="new-tenant-marital-status" maxlength="40" required></div>
                <div class="form-group"><label for="new-tenant-phone">Telefone particular</label><input id="new-tenant-phone" maxlength="30" required></div>
                <div class="form-group"><label for="new-tenant-address-goiania">Endereço em Goiânia</label><input id="new-tenant-address-goiania" maxlength="300" required></div>
                <div class="form-group"><label for="new-tenant-address-origin">Endereço de origem</label><input id="new-tenant-address-origin" maxlength="300" required></div>
                <div class="form-group"><label for="new-tenant-reference-one-name">Referência 1 — nome</label><input id="new-tenant-reference-one-name" maxlength="160" required></div>
                <div class="form-group"><label for="new-tenant-reference-one-phone">Referência 1 — telefone</label><input id="new-tenant-reference-one-phone" maxlength="30" required></div>
                <div class="form-group"><label for="new-tenant-reference-two-name">Referência 2 — nome</label><input id="new-tenant-reference-two-name" maxlength="160" required></div>
                <div class="form-group"><label for="new-tenant-reference-two-phone">Referência 2 — telefone</label><input id="new-tenant-reference-two-phone" maxlength="30" required></div>
                <div class="form-group"><label for="new-tenant-occupation">Empresa ou instituição (opcional)</label><input id="new-tenant-occupation" maxlength="160"></div>
                <div class="form-group"><label for="new-tenant-commercial-phone">Telefone comercial (opcional)</label><input id="new-tenant-commercial-phone" maxlength="30"></div>
                <div class="form-group"><label for="new-tenant-commercial-address">Endereço comercial (opcional)</label><input id="new-tenant-commercial-address" maxlength="300"></div>
            </div>
            <button type="submit" class="btn-primary" style="margin-top:15px;">Cadastrar Morador</button>
        </form>
        <div id="persisted-tenants-list" class="predios-grid"></div>
        <section id="persisted-tenant-detail" class="tenant-detail" hidden>
            <div style="display:flex;justify-content:space-between;gap:12px;"><h4 id="persisted-tenant-name"></h4><button id="btn-close-tenant-detail" type="button" class="btn-secondary">Fechar</button></div>
            <p id="persisted-tenant-document"></p><p id="persisted-tenant-birth"></p><p id="persisted-tenant-contact"></p>
            <p id="persisted-tenant-addresses"></p><p id="persisted-tenant-references"></p><p id="persisted-tenant-unit"></p><p id="persisted-tenant-occupation"></p>
        </section>
    </div>
</div>
