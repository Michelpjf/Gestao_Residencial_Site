<div id="tab-predios" class="tab-content">
    <div id="view-predios-list" class="predios-viewactive">
        <div class="subtab-header">
            <div>
                <h2>Gestão de Residenciais</h2>
                <p class="subtab-desc">Cadastre residenciais e consulte suas unidades persistidas.</p>
            </div>
            <button class="btn-primary restricted-admin-manager" id="btn-toggle-building-form" type="button">Novo Residencial</button>
        </div>
        <div id="building-form-card" class="collapse-card">
            <h4>Cadastrar Novo Residencial</h4>
            <form id="form-new-building">
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="new-building-name">Nome do Residencial</label>
                        <input type="text" id="new-building-name" placeholder="Ex.: Residencial Sol Nascente" minlength="2" maxlength="160" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancel-building">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Residencial</button>
                </div>
            </form>
        </div>
        <div class="buildings-status" id="buildings-status" role="status" aria-live="polite" hidden>
            <span id="buildings-status-message"></span>
            <button type="button" class="btn-secondary" id="btn-retry-buildings" hidden>Tentar novamente</button>
        </div>
        <div class="predios-grid" id="buildings-grid-container"></div>
    </div>

    <div id="view-predios-detail" class="predios-viewdetail" style="display: none;">
        <div class="detail-header-bar">
            <div class="detail-breadcrumbs">
                <span class="breadcrumb-current" id="detail-building-name"></span>
            </div>
            <button class="btn-secondary" id="btn-back-to-buildings" type="button">Voltar aos Residenciais</button>
        </div>
        <div class="subtab-header">
            <div>
                <h2>Unidades</h2>
                <p class="subtab-desc">Identificação, subdivisão e tipo cadastrados no sistema.</p>
            </div>
        </div>
        <form id="form-new-unit" class="collapse-card active restricted-admin-manager">
            <h4>Nova Unidade</h4>
            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="new-unit-identification">Identificação</label>
                    <input id="new-unit-identification" type="text" maxlength="80" required placeholder="Ex.: 101">
                </div>
                <div class="form-group flex-1">
                    <label for="new-unit-subdivision">Subdivisão (opcional)</label>
                    <input id="new-unit-subdivision" type="text" maxlength="80" placeholder="Ex.: Bloco A">
                </div>
                <div class="form-group flex-1">
                    <label for="new-unit-type">Tipo</label>
                    <select id="new-unit-type" required>
                        <option value="quarto">Quarto</option>
                        <option value="loft">Loft</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-primary">Cadastrar Unidade</button>
        </form>
        <div class="buildings-status" id="units-status" role="status" aria-live="polite" hidden>
            <span id="units-status-message"></span>
            <button type="button" class="btn-secondary" id="btn-retry-units" hidden>Tentar novamente</button>
        </div>
        <div id="persisted-units-list" class="predios-grid"></div>
        <section id="persisted-unit-detail" class="collapse-card active" hidden aria-live="polite">
            <h3 id="persisted-unit-identification"></h3>
            <p id="persisted-unit-subdivision"></p>
            <p id="persisted-unit-type"></p>
            <p id="persisted-unit-status"></p>
            <button type="button" id="btn-close-unit-detail" class="btn-secondary">Fechar detalhe</button>
        </section>
    </div>
</div>
