<div id="tab-contratos" class="tab-content">
    <div class="contract-container">
        <div class="subtab-header" style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px;">
            <div><h3 style="font-family:var(--font-heading);color:var(--primary);font-size:18px;font-weight:700;">Contratos</h3><p style="font-size:13px;color:var(--neutral-500);">Contratos persistidos com documento DOCX do modelo temporada-v1.</p></div>
            <button id="btn-retry-contracts" type="button" class="btn-secondary" hidden>Tentar novamente</button>
        </div>
        <div id="contracts-status" class="buildings-status" role="status" aria-live="polite" hidden><span id="contracts-status-message"></span></div>
        <form id="form-new-contract" class="tenant-form">
            <h4 style="margin-bottom:14px;">Gerar novo Contrato</h4>
            <div class="tenant-form-grid">
                <div class="form-group"><label for="new-contract-tenant">Morador titular</label><select id="new-contract-tenant" required></select></div>
                <div class="form-group"><label for="new-contract-rent">Valor do aluguel (R$)</label><input id="new-contract-rent" type="number" min="0.01" max="9999999999.99" step="0.01" required></div>
                <div class="form-group"><label for="new-contract-months">Prazo em meses</label><input id="new-contract-months" type="number" min="1" max="36" value="3" required></div>
                <div class="form-group"><label for="new-contract-start">Data de início</label><input id="new-contract-start" type="date" required></div>
                <div class="form-group"><label for="new-contract-end">Data de término</label><input id="new-contract-end" type="date" required></div>
            </div>
            <button type="submit" class="btn-primary" style="margin-top:15px;">Persistir e preparar DOCX</button>
        </form>
        <div id="persisted-contracts-list" class="predios-grid"></div>
        <section id="persisted-contract-detail" class="tenant-detail" hidden>
            <div style="display:flex;justify-content:space-between;gap:12px;"><h4 id="persisted-contract-title"></h4><button id="btn-close-contract-detail" type="button" class="btn-secondary">Fechar</button></div>
            <p id="persisted-contract-tenant"></p><p id="persisted-contract-unit"></p><p id="persisted-contract-values"></p><p id="persisted-contract-template"></p>
            <button id="btn-download-contract-detail" type="button" class="btn-primary">Baixar DOCX</button>
        </section>
    </div>
</div>
